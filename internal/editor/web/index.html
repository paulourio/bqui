<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy"
      content="default-src bqui: 'unsafe-inline'; img-src bqui: data:; font-src bqui: data:; worker-src bqui: blob:; connect-src bqui:">
<title>bqui editor</title>
<link rel="stylesheet" href="monaco/vs/editor/editor.main.css">
<style>
  /* Embedded FiraCode Nerd Font Mono (SIL OFL 1.1; see fonts/LICENSE), under
     a private family name so a locally installed copy never shadows it. */
  @font-face {
    font-family: "bqui mono";
    src: url("fonts/FiraCodeNerdFontMono-Regular.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: "bqui mono";
    src: url("fonts/FiraCodeNerdFontMono-Bold.ttf") format("truetype");
    font-weight: 700;
    font-style: normal;
    font-display: block;
  }
  :root { color-scheme: light dark; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: transparent; }
  #editor { position: absolute; inset: 0; }
  #boot-error { display: none; font: 13px -apple-system, sans-serif; padding: 16px; color: #c00; }
</style>
</head>
<!-- Monaco defines its theme colors as CSS variables on .monaco-editor,
     .monaco-diff-editor and .monaco-component. Context menus render in a
     shadow root attached outside the editor element, so without this class
     they inherit no colors and draw with a transparent background. -->
<body class="monaco-component">
<div id="editor"></div>
<div id="boot-error"></div>
<script src="monaco/vs/loader.js"></script>
<script src="bqui-editor.js"></script>
</body>
</html>
